name: Settings Freeze Probe

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: Synthetic dataset selection
        required: true
        type: choice
        default: matrix
        options:
          - matrix
          - empty
          - user
          - learn
          - template
          - macro
          - combined
      entry_counts:
        description: Rows per selected table
        required: true
        type: choice
        default: matrix
        options:
          - matrix
          - '1000'
          - '10000'
          - '50000'
      home_modes:
        description: Settings home implementation
        required: true
        type: choice
        default: both
        options:
          - both
          - new
          - legacy
      rounds:
        description: Repetitions for each launch path
        required: true
        type: choice
        default: '10'
        options:
          - '1'
          - '3'
          - '10'
      capture_perfetto:
        description: Capture a Perfetto trace for the first launch in every case
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  settings-freeze-probe:
    name: Pixel 6 Pro API 35
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ZENZ_MODEL_CACHE_DIR: ${{ github.workspace }}/.zenz-model-cache
      ZENZ_DEBUG_NATIVE_ABIS: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-settings-freeze-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-settings-freeze-gradle-
            ${{ runner.os }}-gradle-

      - name: Cache Zenz model
        uses: actions/cache@v5
        with:
          path: .zenz-model-cache
          key: ${{ runner.os }}-zenz-model-v2-4f5423f0fad41a73b1242eb96fe5c12ae4fdca83-Q5_K_M-ggml-model-Q5_K_M.gguf

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Resolve probe matrix
        shell: bash
        run: |
          case "${{ inputs.datasets }}" in
            matrix) echo "SETTINGS_FREEZE_DATASETS=empty,user,learn,template,macro,combined" >> "$GITHUB_ENV" ;;
            *) echo "SETTINGS_FREEZE_DATASETS=${{ inputs.datasets }}" >> "$GITHUB_ENV" ;;
          esac
          case "${{ inputs.entry_counts }}" in
            matrix) echo "SETTINGS_FREEZE_ENTRY_COUNTS=1000,10000,50000" >> "$GITHUB_ENV" ;;
            *) echo "SETTINGS_FREEZE_ENTRY_COUNTS=${{ inputs.entry_counts }}" >> "$GITHUB_ENV" ;;
          esac
          case "${{ inputs.home_modes }}" in
            both) echo "SETTINGS_FREEZE_HOME_MODES=new,legacy" >> "$GITHUB_ENV" ;;
            *) echo "SETTINGS_FREEZE_HOME_MODES=${{ inputs.home_modes }}" >> "$GITHUB_ENV" ;;
          esac

      - name: Run settings freeze probe
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SETTINGS_FREEZE_ROUNDS: ${{ inputs.rounds }}
          SETTINGS_FREEZE_CAPTURE_PERFETTO: ${{ inputs.capture_perfetto }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6_pro
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8192M
          ndk: 29.0.14206865
          cmake: 3.22.1
          enable-hw-keyboard: false
          disable-animations: false
          disable-spellchecker: true
          pre-emulator-launch-script: >-
            avd_config="${ANDROID_AVD_HOME}/test.avd/config.ini" &&
            sed -i '/^[[:space:]]*hw\.keyboard[[:space:]]*=/d' "$avd_config" &&
            printf '%s\n' 'hw.keyboard=no' >> "$avd_config" &&
            grep '^hw.keyboard=no$' "$avd_config"
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-settings-freeze-probe.sh

      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: settings-freeze-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: settings-freeze-artifacts/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
