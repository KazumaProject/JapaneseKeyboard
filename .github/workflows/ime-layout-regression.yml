name: IME Layout Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    name: Build and Lite unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ime-layout-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-ime-layout-gradle-
            ${{ runner.os }}-gradle-

      - name: Validate scripts
        run: bash -n .github/scripts/ime-emulator-common.sh .github/scripts/run-ime-layout-regression.sh

      - name: Build Lite APKs and run unit tests
        run: >-
          ./gradlew
          :app:testLiteStandardDebugUnitTest
          :app:assembleLiteStandardDebug
          :app:assembleLiteStandardDebugAndroidTest
          --stacktrace
          --no-daemon
          --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx2g

      - name: Upload build verification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ime-layout-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/outputs/apk/liteStandard/debug/
            app/build/outputs/apk/androidTest/liteStandard/debug/
            app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  ime-layout:
    name: ${{ matrix.name }}
    needs: verify-build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Pixel 2 API 27 — three-button
            artifact_name: api27-threebutton
            api_level: 27
            profile: pixel_2
            ram_size: 2048M
            navigation_mode: threebutton
          - name: Pixel 2 API 28 — three-button
            artifact_name: api28-threebutton
            api_level: 28
            profile: pixel_2
            ram_size: 2048M
            navigation_mode: threebutton
          - name: Pixel 2 API 29 — gestural
            artifact_name: api29-gestural
            api_level: 29
            profile: pixel_2
            ram_size: 2048M
            navigation_mode: gestural
          - name: Pixel 6 Pro API 35 — three-button
            artifact_name: api35-threebutton
            api_level: 35
            profile: pixel_6_pro
            ram_size: 3072M
            navigation_mode: threebutton
          - name: Pixel 6 Pro API 35 — gestural
            artifact_name: api35-gestural
            api_level: 35
            profile: pixel_6_pro
            ram_size: 3072M
            navigation_mode: gestural

    env:
      IME_LAYOUT_ARTIFACT_NAME: ${{ matrix.artifact_name }}
      IME_NAVIGATION_MODE: ${{ matrix.navigation_mode }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-36"

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-ime-layout-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-ime-layout-gradle-
            ${{ runner.os }}-gradle-

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run IME layout matrix
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api_level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          cores: 2
          ram-size: ${{ matrix.ram_size }}
          heap-size: 512M
          disk-size: 8192M
          enable-hw-keyboard: false
          disable-animations: false
          disable-spellchecker: true
          pre-emulator-launch-script: >-
            avd_config="${ANDROID_AVD_HOME}/test.avd/config.ini" &&
            sed -i '/^[[:space:]]*hw\.keyboard[[:space:]]*=/d' "$avd_config" &&
            printf '%s\n' 'hw.keyboard=no' >> "$avd_config" &&
            grep '^hw.keyboard=no$' "$avd_config"
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/run-ime-layout-regression.sh

      - name: Upload IME layout results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ime-layout-${{ matrix.artifact_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ime-layout-artifacts/${{ matrix.artifact_name }}/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
